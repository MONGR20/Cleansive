# Publishes Cleansive to CurseForge and Wago when a version tag is pushed.
#
#   git tag -a v1.5.4 -m "Cleansive 1.5.4"
#   git push origin v1.5.4
#
# The packager reads .pkgmeta at the repository root, and takes the project
# identifiers from Cleansive/Cleansive.toc (X-Curse-Project-ID, X-Wago-ID).
# It also rewrites ## Version to match the tag, so keep the two in step.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # needed to attach the zip to a GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The packager walks the history to build release notes and to
          # resolve the previous tag. A shallow clone breaks both.
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
